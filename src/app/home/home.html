<div class="flex flex-col">
  <div class="max-w-2xl">
    <h1 class="text-4xl font-bold tracking-tight text-zinc-800 dark:text-zinc-100 sm:text-4xl xs:text-2xl">{{ 'HOME.HEADLINE' | translate }}</h1>
    <p class="mt-6 text-base text-zinc-600 dark:text-zinc-400" [innerHTML]=" 'HOME.INTRO' | translate "></p>
    <p class="mt-6 text-base text-zinc-600 dark:text-zinc-400">{{ 'HOME.INTRO_MOTIVATION' | translate }}</p>
    <p class="mt-6 text-base text-zinc-600 dark:text-zinc-400">{{ 'HOME.INTRO_ACTION' | translate }}</p>
    <div class="text-zinc-500 dark:zinc-400 transition mt-6 flex gap-6">
      <a class="hover:text-zinc-600 dark:hover:text-zinc-300" href="https://www.github.com/simonflarup"><ng-icon name="ionLogoGithub" size="24" /></a>
      <a class="hover:text-zinc-600 dark:hover:text-zinc-300" href="https://www.linkedin.com/in/SimonFlarup"><ng-icon name="ionLogoLinkedin" size="24" /></a>
      <a class="hover:text-zinc-600 dark:hover:text-zinc-300"><ng-icon name="ionDocumentText" size="24" /></a>
    </div>
  </div>
  <div class="mt-16 sm:mt-16">
    <div class="-my-4 flex justify-center gap-5 py-4 sm:gap-8">
      <img
        ngSrc="./images/photos/flight.jpg"
        height="4032"
        width="3024"
        class="aspect-9/10 w-44 flex-none overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800 sm:w-72 sm:rounded-2xl rotate-3 object-cover"
        priority
        alt="View from an airplane window, showing the wing and clouds below"
      />
      <img
        ngSrc="./images/photos/keyboard.jpg"
        height="4000"
        width="6000"
        class="aspect-9/10 w-44 flex-none overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800 sm:w-72 sm:rounded-2xl -rotate-2 object-cover"
        priority
        alt="Close-up side view of a mechanical keyboard with backlighting in rainbow colors"
      />
      <img
        ngSrc="./images/photos/seden.jpg"
        height="495"
        width="1100"
        class="aspect-9/10 w-44 flex-none overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800 sm:w-72 sm:rounded-2xl rotate-1 object-cover"
        priority
        alt="Odense Fjord from Seden Strand"
      />
      <img
        ngSrc="./images/photos/polarcase.jpg"
        height="4032"
        width="2268"
        class="aspect-9/10 w-44 flex-none overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800 sm:w-72 sm:rounded-2xl rotate-2 object-cover"
        priority
        alt="White computer case with penguin and polar bear figures inside, displayed with a white headset and a white dual sense controller"
      />
      <img
        ngSrc="./images/photos/domeDark.jpg"
        height="495"
        width="1100"
        class="aspect-9/10 w-44 flex-none overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800 sm:w-72 sm:rounded-2xl -rotate-3 object-cover"
        priority
        alt="Skylight dome seen from the inside, taken in the savannah exhibition in Aalborg Zoo"
      />
    </div>
  </div>
</div>
