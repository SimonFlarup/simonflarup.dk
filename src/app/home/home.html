<div class="home-layout">
  <div>
    <h1 class="home-headline">{{ 'HOME.HEADLINE' | translate }}</h1>
    <p class="home-intro" [innerHTML]=" 'HOME.INTRO' | translate "></p>
    <p class="home-intro">{{ 'HOME.INTRO_MOTIVATION' | translate }}</p>
    <p class="home-intro">{{ 'HOME.INTRO_ACTION' | translate }}</p>
    <div class="home-socials">
      <a href="https://www.github.com/simonflarup"><ng-icon name="ionLogoGithub" size="24" /></a>
      <a href="https://www.linkedin.com/in/SimonFlarup"><ng-icon name="ionLogoLinkedin" size="24" /></a>
      <a routerLink="/cv" [attr.aria-label]="'CV.TITLE' | translate"><ng-icon name="ionDocumentText" size="24" /></a>
    </div>
  </div>
  <app-image-row/>
  <app-experience-list class="home-work" titleKey="CV.WORK.TITLE" [entries]="workExperience">
    <a list-action routerLink="/cv" class="home-cv-link">
      <ng-icon name="ionDocumentText" size="20" aria-hidden="true" />
      {{ 'HOME.EXPERIENCE.VIEW_CV' | translate }}
    </a>
  </app-experience-list>
  <app-experience-list class="home-section" titleKey="CV.EDUCATION.TITLE" icon="ionSchoolOutline" [entries]="education" />
  <app-experience-list class="home-section" titleKey="CV.OTHER.TITLE" icon="ionPricetagOutline" [entries]="other" [showLogos]="false"/>
</div>
