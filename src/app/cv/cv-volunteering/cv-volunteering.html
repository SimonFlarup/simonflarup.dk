<section class="cv-section">
  <h2 class="cv-heading">
    {{ 'CV.VOLUNTEERING.TITLE' | translate }}
  </h2>
  <hr />
  <div class="flex mt-3">
    <p class="mr-2 cv-text">
      <b>{{ entry().titleKey | translate }}</b><br />
      {{ entry().company }}
    </p>
    <p class="ml-auto cv-text text-right">
      <i>{{ entry().startKey | translate }} - {{ entry().endKey | translate }}</i>
    </p>
  </div>
  <p class="mt-2 cv-text">
    {{ entry().descriptionKey! | translate }}
  </p>
</section>
