<section class="cv-section">
  <h2 class="cv-heading">
    {{ 'CV.VOLUNTEERING.TITLE' | translate }}
  </h2>
  <hr />
  <app-cv-entry-header
    [titleKey]="entry().titleKey"
    [company]="entry().company"
    [startKey]="entry().startKey"
    [endKey]="entry().endKey"
    [largeTopMargin]="true"
  />
  <p class="mt-2 cv-text">
    {{ entry().descriptionKey! | translate }}
  </p>
</section>
