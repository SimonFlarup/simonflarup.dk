<header class="site-header">
    <div>
      <a routerLink="/">
        <img
          ngSrc="images/simon_portrait_ur.jpg"
          width="112"
          height="112"
          alt="Portrait of Simon Flarup"
          class="header-portrait"
          priority
        />
      </a>
    </div>
  <div class="header-navigation">
    <nav class="header-nav">
      <a routerLink="/">{{ 'HOME.TITLE' | translate }}</a>
      <a routerLink="/about">{{ 'ABOUT.TITLE' | translate }}</a>
    </nav>
  </div>
  <div class="header-controls">
    <div class="header-actions">
    <button (click)="toggleDarkMode()" class="header-button">
      {{ darkMode() ? '🌙 ' + ('HEADER.DARK' | translate) : '☀️ ' + ('HEADER.LIGHT' | translate) }}
    </button>
    <button (click)="toggleLanguage()" class="header-button">
      {{ language() === 'en' ? '🇬🇧 English' : '🇩🇰 Dansk' }}
    </button>
    </div>
  </div>
</header>
