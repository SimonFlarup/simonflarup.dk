<header class="site-header">
    <div>
      <a routerLink="/">
        <img
          ngSrc="images/simon_portrait_ur.jpg"
          width="112"
          height="112"
          alt="Portrait of Simon Flarup"
          class="header-portrait"
          priority
        />
      </a>
    </div>
  <div class="header-navigation">
    <nav class="header-nav header-surface">
      <a routerLink="/">{{ 'HOME.TITLE' | translate }}</a>
      <a routerLink="/about">{{ 'ABOUT.TITLE' | translate }}</a>
    </nav>
  </div>
  <div class="header-controls">
    <div class="header-actions">
      <button type="button" popovertarget="header-menu" class="header-menu-trigger header-button header-surface">
        {{ 'HEADER.MENU' | translate }}
        <ng-icon name="ionChevronDown" size="12" aria-hidden="true" />
      </button>
      <button type="button" (click)="toggleDarkMode()" class="header-theme-toggle header-button header-surface"
              [attr.aria-label]="(darkMode() ? 'HEADER.SWITCH_TO_LIGHT' : 'HEADER.SWITCH_TO_DARK') | translate">
        <ng-icon [name]="darkMode() ? 'ionMoonOutline' : 'ionSunnyOutline'" size="20" aria-hidden="true" />
        <span class="header-control-label">{{ (darkMode() ? 'HEADER.DARK' : 'HEADER.LIGHT') | translate }}</span>
      </button>
      <button type="button" (click)="toggleLanguage()" class="header-language-toggle header-button header-surface"
              [attr.aria-label]="(language() === 'en' ? 'HEADER.SWITCH_TO_DANISH' : 'HEADER.SWITCH_TO_ENGLISH') | translate">
        <ng-icon name="ionGlobeOutline" size="20" aria-hidden="true" />
        <span class="header-control-label">{{ language() === 'en' ? 'English' : 'Dansk' }}</span>
      </button>
    </div>
  </div>
  <nav id="header-menu" popover #mobileMenu class="header-menu"
       [attr.aria-label]="'HEADER.MENU' | translate" (click)="mobileMenu.hidePopover()">
    <a routerLink="/">{{ 'HOME.TITLE' | translate }}</a>
    <a routerLink="/about">{{ 'ABOUT.TITLE' | translate }}</a>
  </nav>
</header>
